<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Stock Dashboard</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #f2f5f9;
            color: #17202a;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
        }

        h1 {
            color: #124e78;
        }

        .success {
            color: #137333;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Stock Availability Dashboard</h1>

        <p>RAIPUR ANALYTICS</p>

        <p class="success">
            Dashboard setup is working successfully.
        </p>

        <p>
            Stock data will be connected in the next step.
        </p>
    </div>
</body>
</html>
